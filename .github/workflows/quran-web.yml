name: Deploy web app (iPhone)

# كينشر التطبيق ديال الويب (iPhone) على GitHub Pages
# مرة وحدة: Settings → Pages → Source: "GitHub Actions"
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # التطبيق مطلوع كملف zip (QuranWeb_….zip): كنحلّوه
      - name: Unzip web app
        run: |
          for z in QuranWeb*.zip; do [ -f "$z" ] && unzip -q -o "$z"; done
          test -f QuranWeb/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: QuranWeb

      - id: deployment
        uses: actions/deploy-pages@v4
